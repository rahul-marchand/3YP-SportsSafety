[project]
name = "3yp-sportssafety"
version = "0.1.0"
description = "Sports Safety Project - ML eye tracking, statistical analysis, electronics, and mobile app"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=1.8.3",
    "opencv-python>=4.12.0.88",
    "pillow>=12.0.0",
    "pydantic>=2.0,<2.12",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.67.1",
    "matplotlib>=3.8.0",
    "scipy>=1.13.0",
    "wandb>=0.22.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
